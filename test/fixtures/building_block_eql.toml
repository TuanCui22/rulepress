[metadata]
creation_date = "2024/01/01"
maturity = "production"
updated_date = "2024/01/01"

[rule]
author = ["rulepress test suite"]
description = """
Synthetic fixture. Exercises a building-block EQL rule, whose building_block_type
must survive conversion so Kibana keeps it out of the alerting stream.
"""
from = "now-9m"
index = ["logs-test.events*"]
language = "eql"
license = "MIT"
name = "Test Building Block EQL"
risk_score = 21
rule_id = "aaaaaaaa-0000-4000-8000-000000000005"
severity = "low"
tags = ["Domain: Endpoint", "Rule Type: BBR"]
timestamp_override = "event.ingested"
type = "eql"
building_block_type = "default"

query = '''
process where event.type == "start" and
  process.name in ("at", "schtasks", "systemd-run") and
  process.parent.name != null
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1053"
name = "Scheduled Task/Job"
reference = "https://attack.mitre.org/techniques/T1053/"

[rule.threat.tactic]
id = "TA0002"
name = "Execution"
reference = "https://attack.mitre.org/tactics/TA0002/"
