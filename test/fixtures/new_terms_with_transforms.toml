[metadata]
creation_date = "2024/01/01"
maturity = "production"
updated_date = "2024/01/01"

[rule]
author = ["rulepress test suite"]
description = """
Synthetic fixture. Exercises new_terms plus a [transform] section whose entries are
referenced from the note as $investigate_N placeholders. The converter must render
those into Kibana markdown plugin strings.
"""
from = "now-9m"
index = ["logs-test.events*"]
language = "kuery"
license = "MIT"
name = "Test New Terms With Transforms"
risk_score = 73
rule_id = "aaaaaaaa-0000-4000-8000-000000000002"
severity = "high"
tags = ["Domain: Endpoint", "Rule Type: New Terms", "Resources: Investigation Guide"]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
event.code:"4662" and winlog.event_data.Properties:(*Replication-Get-Changes*) and
not winlog.event_data.SubjectUserName:(*$ or MSOL_*)
'''

note = """## Triage and analysis

### Investigating the test rule

- Does the subject logon session resolve to an unexpected source system?
  - Focus: match `winlog.event_data.SubjectLogonId` to 4624 `winlog.event_data.TargetLogonId`. $investigate_0
  - Hint: missing authentication telemetry is unresolved, not benign.

- Did surrounding directory changes explain how the account obtained the rights?
  - Focus: surrounding 4662 activity plus 5136 changes. $investigate_1

- A placeholder with no matching transform, to prove the warning path: $investigate_9

### False positive analysis

- Synthetic fixture; there is nothing real to analyse here.
"""

setup = """## Setup

Synthetic fixture. No setup required.
"""

[rule.investigation_fields]
field_names = [
    "@timestamp",
    "host.id",
    "winlog.event_data.SubjectUserName",
    "winlog.event_data.Properties",
]

[[transform.investigate]]
label = "Authentication events for the subject logon session"
description = ""
providers = [
  [
    { excluded = false, field = "host.id", queryType = "phrase", value = "{{host.id}}", valueType = "string" },
    { excluded = false, field = "event.code", queryType = "phrase", value = "4624", valueType = "string" },
    { excluded = false, field = "winlog.event_data.TargetLogonId", queryType = "phrase", value = "{{winlog.event_data.SubjectLogonId}}", valueType = "string" }
  ]
]
relativeFrom = "now-24h"
relativeTo = "now"

[[transform.investigate]]
label = "Directory replication and rights events for the subject"
description = ""
providers = [
  [
    { excluded = false, field = "event.code", queryType = "phrase", value = "4662", valueType = "string" },
    { excluded = false, field = "winlog.event_data.SubjectUserSid", queryType = "phrase", value = "{{winlog.event_data.SubjectUserSid}}", valueType = "string" }
  ],
  [
    { excluded = false, field = "event.code", queryType = "phrase", value = "5136", valueType = "string" },
    { excluded = false, field = "winlog.event_data.SubjectUserSid", queryType = "phrase", value = "{{winlog.event_data.SubjectUserSid}}", valueType = "string" }
  ]
]
relativeFrom = "now-24h"
relativeTo = "now"

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1003"
name = "OS Credential Dumping"
reference = "https://attack.mitre.org/techniques/T1003/"

[[rule.threat.technique.subtechnique]]
id = "T1003.006"
name = "DCSync"
reference = "https://attack.mitre.org/techniques/T1003/006/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.new_terms]
field = "new_terms_fields"
value = ["winlog.event_data.SubjectUserName"]

[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-15d"
