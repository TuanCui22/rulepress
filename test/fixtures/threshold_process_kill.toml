[metadata]
creation_date = "2024/01/01"
maturity = "production"
updated_date = "2024/01/01"

[rule]
author = ["rulepress test suite"]
description = """
Synthetic fixture. Exercises a threshold rule whose [rule.threshold] carries its
field list as a real array, which is the shape the Elastic repo uses.
"""
from = "now-9m"
index = ["logs-test.events*"]
language = "kuery"
license = "MIT"
name = "Test Threshold Process Kill"
risk_score = 47
rule_id = "aaaaaaaa-0000-4000-8000-000000000003"
severity = "medium"
tags = ["Domain: Endpoint", "OS: Linux", "Rule Type: Threshold"]
timestamp_override = "event.ingested"
type = "threshold"

query = '''
event.category:process and event.type:start and (
  (process.name:"pkill" and process.args:"-f") or
  (process.name:kill and process.args:"-9")
)
'''

[rule.threat]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1489"
name = "Service Stop"
reference = "https://attack.mitre.org/techniques/T1489/"

[rule.threat.tactic]
id = "TA0040"
name = "Impact"
reference = "https://attack.mitre.org/tactics/TA0040/"

[rule.threshold]
field = ["host.id", "process.executable", "user.name"]
value = 15
