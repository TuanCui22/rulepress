[hunt]
author = "rulepress test suite"
description = """
Synthetic fixture. Mirrors the shape of a hunting query under hunting/** in the
Elastic repo: a [hunt] table with a different schema that Kibana cannot import as
a detection rule. The converter must classify it and skip it, not fail it.
"""
integration = ["test.events"]
uuid = "aaaaaaaa-0000-4000-8000-000000000006"
name = "Test Hunting Query"
language = ["ES|QL"]
license = "MIT"
notes = [
    "Synthetic fixture; there is nothing real to hunt here",
]
mitre = ['T1578.002']
query = [
    '''
from logs-test.events-*
| where @timestamp > now() - 7 day
| where event.action == "RunInstances"
| stats attempts = count(*) by user.name
| where attempts >= 10
'''
]
