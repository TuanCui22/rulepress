[metadata]
creation_date = "2024/01/01"
maturity = "production"
updated_date = "2024/01/01"

[rule]
author = ["rulepress test suite"]
description = """
Synthetic fixture. Exercises new_terms conversion together with [[rule.filters]],
including a filter that carries no $state so the defaulting path is covered.
"""
from = "now-9m"
index = ["logs-test.events*"]
language = "kuery"
license = "MIT"
name = "Test New Terms With Filters"
risk_score = 47
rule_id = "aaaaaaaa-0000-4000-8000-000000000001"
severity = "medium"
tags = ["Domain: Endpoint", "Rule Type: New Terms"]
timestamp_override = "event.ingested"
type = "new_terms"

query = '''
event.action:"handle_access" and process.name:* and
not process.executable:("/usr/bin/benign", "/opt/benign/*")
'''

[[rule.filters]]
[rule.filters.meta]
negate = true
[rule.filters.query.wildcard."process.executable"]
case_insensitive = true
value = "/opt/trusted/*"

[[rule.filters]]
[rule.filters.meta]
negate = true
[rule.filters.query.wildcard."process.name"]
case_insensitive = true
value = "known-*.bin"

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1003"
name = "OS Credential Dumping"
reference = "https://attack.mitre.org/techniques/T1003/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

[rule.new_terms]
field = "new_terms_fields"
value = ["process.executable", "user.name"]

[[rule.new_terms.history_window_start]]
field = "history_window_start"
value = "now-1d"
