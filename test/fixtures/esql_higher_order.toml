[metadata]
creation_date = "2024/01/01"
maturity = "production"
updated_date = "2024/01/01"

[rule]
author = ["rulepress test suite"]
description = """
Synthetic fixture. Exercises an ES|QL rule, which carries no `index` array because
the query names its own source. The converter and validator must not demand one.
"""
from = "now-8h"
interval = "1h"
language = "esql"
license = "MIT"
name = "Test ES|QL Higher Order Rule"
risk_score = 73
rule_id = "aaaaaaaa-0000-4000-8000-000000000004"
severity = "high"
tags = ["Use Case: Threat Detection", "Rule Type: Higher-Order Rule", "Rule Type: ES|QL"]
timestamp_override = "event.ingested"
type = "esql"

query = '''
from .alerts-test.*  metadata _id

// keep medium-or-higher severity alerts from real detection rules
| where kibana.alert.risk_score > 21 and
        kibana.alert.rule.name IS NOT NULL and
        host.id is not null and
        kibana.alert.rule.type not in ("threat_match", "machine_learning")

// aggregate per host
| stats Esql.alerts_count = COUNT(*),
        Esql.rule_name_distinct_count = COUNT_DISTINCT(kibana.alert.rule.name),
        Esql.tactic_id_distinct_count = COUNT_DISTINCT(kibana.alert.rule.threat.tactic.id) by host.id

// only hosts with several distinct rules across several tactics
| where Esql.rule_name_distinct_count >= 2 and
        Esql.tactic_id_distinct_count >= 3

| keep host.id,
       Esql.alerts_count,
       Esql.rule_name_distinct_count,
       Esql.tactic_id_distinct_count
'''

[rule.investigation_fields]
field_names = ["host.id", "Esql.alerts_count", "Esql.rule_name_distinct_count"]
